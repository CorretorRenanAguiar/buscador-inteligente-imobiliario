services:

  postgres:

    image: postgres:15

    container_name: evolution_postgres

    restart: always

    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution

    ports:
      - "5432:5432"

    volumes:
      - evolution_postgres:/var/lib/postgresql/data



  redis:

    image: redis:latest

    container_name: evolution_redis

    restart: always

    ports:
      - "6379:6379"



  evolution-api:

    image: atendai/evolution-api:latest

    container_name: evolution_api

    restart: always

    depends_on:
      - postgres
      - redis

    ports:
      - "8080:8080"

    environment:

      SERVER_TYPE: http

      SERVER_PORT: 8080

      SERVER_URL: http://localhost:8080

      AUTHENTICATION_API_KEY: renan123

      CONFIG_SESSION_PHONE_CLIENT: RA_IMOBILIARIA

      DATABASE_ENABLED: "true"

      DATABASE_PROVIDER: postgresql

      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public

      CACHE_REDIS_ENABLED: "true"

      CACHE_REDIS_URI: redis://redis:6379/6

      LOG_LEVEL: ERROR

    volumes:
      - evolution_instances:/evolution/instances



volumes:

  evolution_instances:

  evolution_postgres: