services:

  postgres:

    image: postgres:15

    container_name: evolution_postgres

    restart: always

    environment:

      POSTGRES_USER: evolution

      POSTGRES_PASSWORD: evolution

      POSTGRES_DB: evolution

    ports:

      - "5432:5432"

    volumes:

      - evolution_postgres:/var/lib/postgresql/data



  redis:

    image: redis:7-alpine

    container_name: evolution_redis

    restart: always

    ports:

      - "6379:6379"



  evolution-api:

    image: atendai/evolution-api:v2.1.1

    container_name: evolution_api

    restart: always

    depends_on:

      - postgres

      - redis

    ports:

      - "8080:8080"

    environment:

      SERVER_TYPE: http

      SERVER_PORT: 8080

      SERVER_URL: http://localhost:8080

      AUTHENTICATION_API_KEY: RENAN_EVOLUTION_2026

      CONFIG_SESSION_PHONE_CLIENT: RA_IMOBILIARIA

      CONFIG_SESSION_PHONE_VERSION: 2.3000.1023249347

      WEB_VERSION: 2.3000.1023249347

      DATABASE_ENABLED: "true"

      DATABASE_PROVIDER: postgresql

      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public

      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange

      DATABASE_SAVE_DATA_INSTANCE: "true"

      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"

      DATABASE_SAVE_MESSAGE_UPDATE: "true"

      DATABASE_SAVE_DATA_CONTACTS: "true"

      DATABASE_SAVE_DATA_CHATS: "true"

      DATABASE_SAVE_DATA_LABELS: "true"

      DATABASE_SAVE_DATA_HISTORIC: "true"

      CACHE_REDIS_ENABLED: "true"

      CACHE_REDIS_URI: redis://redis:6379/6

      LOG_LEVEL: ERROR

      DEL_INSTANCE: "false"

      QRCODE_LIMIT: 30

      QRCODE_COLOR: "#198754"

      WEBHOOK_GLOBAL_ENABLED: "false"

      LANGUAGE: pt-BR

    volumes:

      - evolution_instances:/evolution/instances



volumes:

  evolution_instances:

  evolution_postgres: